name: Checks

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  app:
    name: App (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install packages
        run: npm ci
      - name: Type-check the app
        run: npm run typecheck
      - name: Dependencies pinned and lockfile present
        run: npm run check:pinned
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
      - name: No secrets in the repository
        run: npm run check:secrets

  edge:
    name: Supabase Edge Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8
      - name: Unit tests (limits, validation, Gemini settings)
        run: npm run test:edge
      - name: Type-check the functions
        run: deno check --frozen supabase/functions/chat/index.ts supabase/functions/delete-account/index.ts
      - name: Lint the functions
        run: deno lint supabase/functions

  quota:
    name: Usage limits under concurrency (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Run the concurrency test
        run: bash supabase/tests/quota_concurrency.sh
